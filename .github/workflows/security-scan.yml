name: Security Scan

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Name of the docker image'
        required: true
        type: string
      tag:
        description: 'Tag for the docker image'
        required: true
        type: string

jobs:
  scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402250b2376d921b447076 # v0.29.0
        with:
          image-ref: '${{ inputs.image_name }}:${{ inputs.tag }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@9e8d4cfec7d4a5f3e806c0580d704bc564301b5d # v3.28.10
        with:
          sarif_file: 'trivy-results.sarif'
