name: DAST Dynamic Security Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan (e.g. https://staging.chatapp.com)'
        required: true
        default: 'http://localhost:3000'
  workflow_call:
    inputs:
      target_url:
        description: 'Target URL to scan'
        required: true
        type: string

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  dast-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@110058c4f039a5c9f52f36f9bcbf8818f97b5e40 # v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: '${{ inputs.target_url }}'
          cmd_options: '-a'
          allow_issue_writing: false

      - name: Upload DAST Report Artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: zap-dast-report
          path: zap_report.html
