name: Docker Build

on:
  workflow_call:
    inputs:
      context:
        description: 'Directory context for docker build'
        required: true
        type: string
      image_name:
        description: 'Name of the docker image'
        required: true
        type: string
      tag:
        description: 'Tag for the docker image'
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # required for sigstore/cosign

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bec833647229e18b5f3a63f0 # v3.5.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b45648f9ec2f093222e4ff94 # v3.10.0

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6de7d076f3753a9e # v6.15.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/Dockerfile
          push: true
          tags: ${{ inputs.image_name }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@55dad29e3a7a9e0f666f7f631a0e19fbcebc6895 # v0.17.9
        with:
          image: ${{ inputs.image_name }}:${{ inputs.tag }}
          artifact-name: sbom.spdx.json

      - name: Sign the published Docker image
        env:
          TAGS: ${{ inputs.image_name }}:${{ inputs.tag }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          # Sign the image digest
          cosign sign --yes "${{ inputs.image_name }}@${DIGEST}"
