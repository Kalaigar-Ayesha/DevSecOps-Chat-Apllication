apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-cosign
  annotations:
    policies.kyverno.io/title: Verify Image Cosign Signature
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Verifies that container images deployed to the cluster have been signed 
      by Sigstore/Cosign during the CI/CD build pipeline.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: verify-signature
      match:
        any:
        - resources:
            kinds:
              - Pod
      verifyImages:
      - imageReferences:
        - "docker.io/kayesha01/chat-app-*"
        - "kayesha01/chat-app-*"
        attestors:
        - count: 1
          entries:
          - keyless:
              issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/Kalaigar-Ayesha/DevSecOps-Chat-Apllication/*"
